const b64=s=>Uint8Array.from(atob(s),c=>c.charCodeAt(0));
async function mo(mk){
  const k0=await crypto.subtle.importKey('raw',new TextEncoder().encode(mk),'PBKDF2',false,['deriveKey']);
  const k=await crypto.subtle.deriveKey({name:'PBKDF2',salt:b64(G.s),iterations:G.v,hash:'SHA-256'},k0,{name:'AES-GCM',length:256},false,['decrypt']);
  const t=await crypto.subtle.decrypt({name:'AES-GCM',iv:b64(G.i)},k,b64(G.d));
  return new TextDecoder().decode(t);
}
async function thu(mk,nho){
  try{const h=await mo(mk);if(nho){try{localStorage.setItem('mk',mk)}catch(e){}}document.open();document.write(h);document.close();}
  catch(e){document.getElementById('loi').textContent=nho?'Sai mật khẩu':'';try{if(!nho)localStorage.removeItem('mk')}catch(e){}}
}
document.getElementById('f').onsubmit=e=>{e.preventDefault();thu(document.getElementById('mk').value,true);};
let luu=null;try{luu=localStorage.getItem('mk')}catch(e){}
if(luu)thu(luu,false);
